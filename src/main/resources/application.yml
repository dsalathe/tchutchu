spring:
  profiles:
    active: local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/dsalathe-apps

application:
  name: "tchutchu"
  description: "An implementation of the game Tickets to ride in scala 3, with WebSockets"

app:
  keycloak:
    client-id: tchutchu

server:
  port: 8080

management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "*"
  endpoint:
    metrics:
      enabled: true
    health:
      enabled: true
      show-details: always

logging:
  file:
    name: logs/tchutchu.log
